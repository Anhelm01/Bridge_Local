[project]
name = "bridge-local"
version = "0.1.0"
description = "Cross-platform Linux-to-Windows remote management & file sync over LAN"
readme = "README.md"
authors = [
    { name = "Anhelm01", email = "anhelmgreatagain@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "watchdog>=6.0.0",
    "typer>=0.15",
    "rich>=14.0",
    "psutil>=7.0",
    "pywin32>=310; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Linux-only dependencies (CLI client)
linux = [
    "typer>=0.15",
    "rich>=14.0",
]
# Windows-only dependencies (agent/service)
windows = [
    "pywin32>=310; sys_platform == 'win32'",
    "psutil>=7.0",
]
# Development tools
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "mypy>=1.15",
]

[project.scripts]
bridge-cli = "bridge_local:main"
bridge-agent = "bridge_agent_win.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]



[tool.uv.workspace]
members = []

# --- Ruff Configuration ---
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]  # Allow Cyrillic and Typer argument defaults

[tool.ruff.format]
quote-style = "double"

# --- Mypy Configuration ---
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "psutil",
    "win32service",
    "win32serviceutil",
    "win32event",
    "servicemanager",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bridge_client_linux.tui.app"
disable_error_code = ["attr-defined"]

# --- Pytest Configuration ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = [
    "src/bridge_core",
    "src/bridge_agent_win",
    "src/bridge_client_linux",
    "src/bridge_local"
]
