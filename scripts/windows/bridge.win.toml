# ==============================================================================
# BRIDGE LOCAL - WINDOWS AGENT CONFIGURATION (bridge.win.toml)
# ==============================================================================
# Режим разработчика (Hyper-Logging):
# true  - подробная трассировка (пакеты, миллисекунды, TRACE/DEBUG, сокеты, PID)
# false - тихий релизный режим (только ключевые события, INFO/ERROR)
dev_mode = false

[node]
name = "win-pc"
display_name = "Windows Rig"

[connection]
host = "0.0.0.0"
port = 9732
timeout_sec = 5.0
psk_token = "REPLACE_WITH_YOUR_SECRET_TOKEN_32_CHARS"

[heartbeat]
interval_sec = 2.0
timeout_sec = 1.5
max_missed = 3

[pocket]
path = "./pocket"
logs_subdir = "logs"
sync_watch = true

[exec]
default_timeout_sec = 30
run_as_admin = true
force_utf8 = true

[logging]
level = "INFO"
dev_mode = false
console_output = true
file_output = ""
