[node]
name = "workstation-linux"
display_name = "Linux Host"

[connection]
host = "0.0.0.0"
port = 9732
timeout_sec = 5.0
tls_cert_path = ""
tls_key_path = ""
psk_token = "BridgeLocalSecretKey_Anhelm_2026_Secure"

[heartbeat]
interval_sec = 2.0
timeout_sec = 1.5
max_missed = 3
reconnect_delay_sec = 5.0

[pocket]
path = "./pocket"
logs_subdir = "logs"
sync_watch = true
max_chunk_size = 65536
log_max_days = 30

[exec]
default_timeout_sec = 30
run_as_admin = true
force_utf8 = true

[logging]
level = "TRACE"
dev_mode = true
console_output = true
file_output = ""
